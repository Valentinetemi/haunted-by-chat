<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haunted by Chat</title>
  </head>
  <body>
    <div id="app"></div>
    <button id="start-screen" type="button">
      <span>Click to start</span>
      <small>WASD to move · Mouse to look · Left click to stun · Esc to pause</small>
    </button>
    <p id="whisper-message" aria-live="polite" hidden></p>
    <p id="interaction-prompt" hidden></p>
    <p id="goal-prompt" hidden></p>
    <div id="jumpscare" aria-hidden="true" hidden>
      <span></span>
    </div>
    <aside id="twitch-feed" aria-live="polite" aria-label="Twitch scare feed"></aside>
    <aside id="stun-hud" aria-label="Stun blaster ammunition">
      <span>Stun</span>
      <strong id="shots-remaining">3</strong>
      <small>shots</small>
    </aside>
    <aside id="stamina-hud" aria-label="Sprint stamina">
      <span>Stamina</span>
      <div><i id="stamina-fill"></i></div>
    </aside>
    <aside id="key-hud" aria-label="Keys collected">
      <span>House keys</span>
      <strong id="keys-collected">0 / 5</strong>
    </aside>
    <aside id="timer-hud" aria-label="Escape timer">
      <span>Escape time</span>
      <strong id="run-time">00:00.000</strong>
    </aside>
    <section id="caught-screen" role="dialog" aria-modal="true" aria-labelledby="caught-title" hidden>
      <h1 id="caught-title">Terminated</h1>
      <button id="restart-button" type="button">Restart</button>
    </section>
    <section id="escape-screen" role="dialog" aria-modal="true" aria-labelledby="escape-title" hidden>
      <h1 id="escape-title">Escaped</h1>
      <p class="score-line">Time <strong id="final-time">--:--.---</strong></p>
      <p class="score-line">Best <strong id="best-time">No escape yet</strong></p>
      <button id="play-again-button" type="button">Play again</button>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
